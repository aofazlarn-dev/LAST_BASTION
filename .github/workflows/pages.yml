# ส่งขึ้น GitHub Pages เฉพาะไฟล์ที่เกมใช้ (~10 MB) ไม่รวมภาพต้นฉบับ (sheets, anim_v3, rush_drafts)
name: Deploy game to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect game files
        run: |
          mkdir -p _site/assets
          cp index.html rush.html .nojekyll _site/
          cp -r assets/art assets/anim assets/cover.jpg _site/assets/
          du -sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
